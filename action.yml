name: Gerberus
description: Check a KiCad or Altium schematic for electrical bugs, and list what a pull request changed.
branding:
  icon: cpu
  color: green

inputs:
  design:
    description: The design to check, a KiCad root .kicad_sch, an Altium .PrjPcb or a single .SchDoc, relative to the repository.
    required: true
  args:
    description: Extra arguments for `gerberus check`, such as `--unknown`.
    required: false
    default: ""
  version:
    description: >-
      The Gerberus release to install, such as `v0.2.0`, or `latest`. Pin it (and the action, `@v0.2.0`) so a new
      release can't change a passing check by itself.
    required: false
    default: latest
  diff:
    description: >-
      On a pull request, also run `gerberus diff` against the base branch and fail when the pull request adds an
      error. `true` or `false`.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Gerberus
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      # The PATH entry is the installer's fixed bin directory, not an input.
      run: | # zizmor: ignore[github-env]
        if [ "$VERSION" = latest ]; then
          url=https://github.com/roccoagain/gerberus/releases/latest/download/gerberus-installer.sh
        else
          url="https://github.com/roccoagain/gerberus/releases/download/$VERSION/gerberus-installer.sh"
        fi
        curl --proto '=https' --tlsv1.2 -LsSf "$url" | sh
        echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

    - name: Check
      shell: bash
      env:
        DESIGN: ${{ inputs.design }}
        ARGS: ${{ inputs.args }}
      run: |
        status=0
        # shellcheck disable=SC2086
        gerberus check "$DESIGN" --color never $ARGS > gerberus-check.txt || status=$?
        cat gerberus-check.txt
        {
          echo '## Gerberus check'
          echo '```'
          cat gerberus-check.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

    - name: Diff against the base branch
      if: ${{ always() && inputs.diff == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        DESIGN: ${{ inputs.design }}
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        # Fetch only the base commit. A shallow checkout (the default) stays shallow; a full one isn't made shallow.
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --no-tags --depth=1 origin "$BASE"
        else
          git fetch --no-tags origin "$BASE"
        fi
        status=0
        gerberus diff "$DESIGN" --rev "$BASE" > gerberus-diff.txt || status=$?
        cat gerberus-diff.txt
        {
          echo '## Gerberus: what this pull request changed'
          echo '```'
          cat gerberus-diff.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
