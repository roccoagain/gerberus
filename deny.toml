# cargo-deny: run `cargo deny check` before adding or bumping a dependency. CI runs it on every push.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, including unmaintained and unsound crates. Ignore one only with a
# reason next to its ID.
ignore = []

[licenses]
# Permissive licenses only, so Gerberus can be shipped under any license later.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
