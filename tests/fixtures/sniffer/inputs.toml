# Connector pins nothing outside drives. Every other connector pin with no input makes its net UNKNOWN.

[[undriven]]
pin = "J1.2"
source = "hardware/sniffer/DESIGN.md, J1 row: 2 TX (board → host); the host only listens on it"

[[undriven]]
pin = "J2.1"
source = "hardware/sniffer/DESIGN.md, J2 row: ARM 6-pin pinout, 1 VCC. No particular probe is used; assumes whichever one only senses the target voltage here and doesn't power the board through it, and that the board is powered while a probe is connected"

[[undriven]]
pin = "J2.6"
source = "hardware/sniffer/DESIGN.md, J2 row: 6 SWO (unused); the probe only listens on SWO"
