[package]
name = "gerberus"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
cfb = "0.16.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.2.1"
ureq = { version = "3", features = ["platform-verifier"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise for this codebase. Part names, file formats and tool names (KiCad, SchDoc,
# PcbDoc, LCSC) are everywhere in doc comments, the library has one user (the binary), and the checkers are
# long, flat lists of rules that read better as one function than as many.
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
items_after_statements = "allow"
# Voltages and counts are far below 2^52, so i64/u64 -> f64 never loses anything that matters.
cast_precision_loss = "allow"
# Coordinates, units and counts come out of files whose formats bound them; the casts that turn them into
# indices and grid units are deliberate.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Voltages are compared exactly on purpose: equal ends are the same parsed or propagated value, not the
# result of arithmetic that could drift.
float_cmp = "allow"
struct_field_names = "allow"
return_self_not_must_use = "allow"
# Leftovers that should never reach main.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
