mpn = "2N7002NXAKR"
manufacturer = "Nexperia"
description = "60 V N-channel trench MOSFET, ESD protected gate, SOT-23"
class = "ic"

[datasheet]
title = "2N7002NXAK 60 V, single N-channel Trench MOSFET"
document = "Product data sheet, 1 July 2019"
url = "https://www.lcsc.com/datasheet/C551416.pdf"

# The datasheet's type number is 2N7002NXAK (Table 3); the R suffix is the reel packing.
[pins]
1 = "G"
2 = "S"
3 = "D"

[[limit]]
pins = ["D"]
to = "S"
abs_max = { min = { unknown = "a negative VDS forward-biases the source-drain diode; it is limited by current (IS), not voltage" }, max = 60, page = 3, note = "VDS drain-source voltage, Tj = 25 °C" }
recommended = { unknown = "no recommended operating conditions are given" }

[[limit]]
pins = ["G"]
to = "S"
abs_max = { min = -20, max = 20, page = 3, note = "VGS gate-source voltage" }
recommended = { unknown = "no recommended operating conditions are given" }

# No [[drive]] for the source-drain diode: gerberus reads a forward drive as setting the cathode net, which is
# right for a series diode but not for a low-side switch, whose drain other parts pull anywhere up to 60 V.
# VSD is 0.47 to 1.2 V at IS = 115 mA (page 6).

# The channel: VGSth in the table is at Tj = 25 °C; Fig. 12 (p8) shows it falling as the part heats up, which
# is why gerberus takes the threshold as 0 V. RDSon is given down to VGS = 5 V, so past that it is fully on.
[[drive]]
kind = "channel"
pin = "D"
to = "S"
gate = "G"
range = { min = 1.1, max = 2.1, page = 6, note = "VGSth gate-source threshold voltage, ID = 250 µA, VDS = VGS, Tj = 25 °C" }
on = { vgs = 5, page = 6, note = "RDSon at VGS = 5 V, ID = 100 mA, Tj = 25 °C: 5.2 Ω max" }
