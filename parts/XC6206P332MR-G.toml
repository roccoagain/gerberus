mpn = "XC6206P332MR-G"
manufacturer = "Torex"
description = "3.3 V 200 mA LDO, SOT-23 (MR)"
class = "ic"
temperature = { min = -40, max = 85, page = 3, note = "Topr operating ambient temperature" }

[datasheet]
title = "XC6206 Series Positive Voltage Regulators"
document = "ETR0305_004b"
url = "https://www.lcsc.com/datasheet/C5446.pdf"

[pins]
1 = "VSS"
2 = "VOUT"
3 = "VIN"

[[limit]]
pins = ["VIN"]
to = "VSS"
abs_max = { min = { none = "the absolute maximum ratings table gives only a maximum for VIN" }, max = 7.0, page = 3 }
recommended = { min = 1.8, max = 6.0, page = 4, note = "electrical characteristics: input voltage VIN" }

[[limit]]
pins = ["VOUT"]
to = "VSS"
abs_max = { min = -0.3, max = { pin = "VIN", plus = 0.3 }, page = 3 }
recommended = { none = "VOUT is the regulated output; no separate operating range is given" }

[[drive]]
kind = "regulates"
pin = "VOUT"
to = "VSS"
supply = "VIN"
headroom = { volts = 1.0, page = 4, note = "note 1: unless otherwise stated, VIN = VOUT(T) + 1.0 V" }
range = { min = 3.234, max = 3.366, page = 5, note = "table E-1, 3.3 V with accuracy code 2 (+/-2 %), IOUT = 30 mA, VIN = VOUT + 1 V, Ta = 25 C" }

[[supply]]
pins = ["VIN"]
current = { min = 0, max = 0.000003, page = 4, note = "IDD supply current, max at Ta = 25 C only (no maximum over temperature); the ground current at load isn't given" }
