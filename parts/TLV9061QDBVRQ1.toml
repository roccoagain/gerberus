mpn = "TLV9061QDBVRQ1"
manufacturer = "Texas Instruments"
description = "Automotive 10 MHz RRIO CMOS op-amp, single, SOT-23-5 (DBV)"
class = "ic"

[datasheet]
title = "TLV906xS-Q1 Automotive 10-MHz, RRIO, CMOS Operational Amplifiers"
document = "SBOS966H, revised June 2023"
url = "https://www.ti.com/lit/ds/symlink/tlv9061-q1.pdf"

# Table 7-1, DBV column (page 5). The datasheet prints the inputs as +IN and –IN (en dash) and the supplies
# as V+ and V– (en dash).
[pins]
1 = "OUT"
2 = "V–"
3 = "+IN"
4 = "–IN"
5 = "V+"

[[limit]]
pins = ["V+"]
to = "V–"
abs_max = { min = 0, max = 6, page = 8, note = "supply voltage [(V+) – (V–)]" }
recommended = { min = 1.8, max = 5.5, page = 8, note = "VS supply voltage" }

[[limit]]
pins = ["+IN", "–IN"]
to = "V–"
abs_max = { min = -0.5, max = { pin = "V+", plus = 0.5 }, page = 8, derived = "-0.5 .. V+ + 0.5; common-mode (V–) – 0.5 to (V+) + 0.5, measured from V–", note = "inputs are diode-clamped to the rails; limit the current to 10 mA beyond 0.5 V (note 2)" }
recommended = { min = -0.1, max = { pin = "V+", plus = 0.1 }, page = 8, derived = "-0.1 .. V+ + 0.1; VI input voltage (V–) – 0.1 to (V+) + 0.1, measured from V–" }

[[limit]]
quantity = "current"
pins = ["+IN", "–IN"]
abs_max = { min = -0.01, max = 0.01, page = 8, note = "signal input pins, current, –10 to 10 mA" }
recommended = { unknown = "the recommended operating conditions give no input current" }

[[limit]]
pins = ["OUT"]
to = "V–"
abs_max = { unknown = "the absolute maximum ratings give only output short-circuit (continuous), no output voltage" }
recommended = { min = 0, max = { pin = "V+" }, page = 8, derived = "0 .. V+; VO output voltage V– to V+, measured from V–" }

[[esd]]
model = "hbm"
volts = 4000
page = 8
note = "AEC Q100-002, 'all other packages' (the TLV9061S-Q1 packages are ±2000 V)"

[[esd]]
model = "cdm"
volts = 1500
page = 8
note = "AEC Q100-011"

[[capacitance]]
pins = ["+IN", "–IN"]
to = "V–"
typ = 4
page = 10
note = "CIC common-mode input capacitance (typical only); CID differential is 2 pF"
