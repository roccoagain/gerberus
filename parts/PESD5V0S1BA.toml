[[capacitance]]
pins = ["K1"]
to = "K2"
typ = 35
max = 45
page = 4
note = "Cd diode capacitance, f = 1 MHz, VR = 0 V, Tamb = 25 °C"

[[esd]]
model = "iec-contact"
volts = 30000
page = 3
note = "IEC 61000-4-2 contact discharge, pin 1 to pin 2; no air-discharge figure is given"

[[esd]]
model = "hbm"
volts = 10000
page = 3
note = "HBM MIL-Std 883"
