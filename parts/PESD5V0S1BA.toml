mpn = "PESD5V0S1BA"
manufacturer = "Nexperia"
description = "Bidirectional 5 V ESD protection diode, SOD323"
class = "tvs"

[datasheet]
title = "PESD5V0S1BA Bidirectional ESD protection diode"
document = "Product data sheet, 26 April 2024"
url = "https://www.lcsc.com/datasheet/C19224.pdf"

[pins]
1 = "K1"
2 = "K2"

[[limit]]
pins = ["K1"]
to = "K2"
bidirectional = true
abs_max = { unknown = "the limiting values rate pulses (PPPM, IPPM), not a voltage" }
