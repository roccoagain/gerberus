mpn = "STM32G030F6P6TR"
manufacturer = "STMicroelectronics"
description = "Arm Cortex-M0+ MCU, 32 KB flash, TSSOP-20"
class = "ic"
temperature = { min = -40, max = 85, page = 41, note = "TA, Table 21 general operating conditions" }
theta_ja = { value = 88, page = 90, note = "Table 71, TSSOP20 6.4 x 4.4 mm, junction to ambient" }
tj_max = { value = 105, page = 41, note = "TJ junction temperature, Table 21; the absolute maximum TJ is 150 C" }

[datasheet]
title = "STM32G030x6/x8 Arm Cortex-M0+ 32-bit MCU, up to 64 KB Flash, 8 KB RAM, 2x USART, timers, ADC, comm. I/Fs, 2.0-3.6V"
document = "DS12991 Rev 3"
url = "https://www.lcsc.com/datasheet/C529330.pdf"

# TSSOP20 column of Table 12 (pages 30 to 34). Several pads bond more than one GPIO; every I/O on this
# package, NRST included, has an FT_xx structure.
[pins]
1 = "PB7/PB8"
2 = "PB9/PC14"
3 = "PC15"
4 = "VDD/VDDA"
5 = "VSS/VSSA"
6 = "NRST"
7 = "PA0"
8 = "PA1"
9 = "PA2"
10 = "PA3"
11 = "PA4"
12 = "PA5"
13 = "PA6"
14 = "PA7"
15 = "PA8/PB0/PB1/PB2"
16 = "PA11/PA9"
17 = "PA12/PA10"
18 = "PA13"
19 = "PA14-BOOT0/PA15"
20 = "PB3/PB4/PB5/PB6"

[[limit]]
pins = ["VDD/VDDA"]
to = "VSS/VSSA"
abs_max = { min = -0.3, max = 4.0, page = 40 }
recommended = { min = 2.0, max = 3.6, page = 41 }

[[limit]]
pins = ["PB7/PB8", "PB9/PC14", "PC15", "NRST", "PA0", "PA1", "PA2", "PA3", "PA4", "PA5", "PA6", "PA7", "PA8/PB0/PB1/PB2", "PA11/PA9", "PA12/PA10", "PA13", "PA14-BOOT0/PA15", "PB3/PB4/PB5/PB6"]
to = "VSS/VSSA"
abs_max = { min = -0.3, max = { pin = "VDD/VDDA", plus = 4.0 }, page = 40, note = "FT_xx pins; above 4 V the internal pull-up and pull-down must be disabled" }
recommended = { min = -0.3, max = { pin = "VDD/VDDA", plus = 3.6, at_most = 5.5 }, page = 41, note = "pull-up and pull-down must be disabled above VDD + 0.3 V" }

[[esd]]
model = "hbm"
volts = 1000
page = 58
note = "Table 45, ANSI/ESDA/JEDEC JS-001, class 1C"

[[esd]]
model = "cdm"
volts = 500
page = 58
note = "Table 45, ANSI/ESDA/JEDEC JS-002, class C2a"

[[supply]]
pins = ["VDD/VDDA"]
current = { min = 0, max = 0.01119, page = 44, derived = "0 .. (8.3 + (0.5 + 3.1 + 2.9 + 0.9 + 0.7 + 0.5 + 3.2 + 9.8 + 23.5) * 64 / 1000) / 1000; IDD(Run) max 8.3 mA (Table 25, Range 1, 64 MHz from Flash, die at 85 C, VDD = 3.6 V, peripherals disabled) plus every peripheral enabled at 64 MHz: IOPORT, GPIOA to GPIOF, bus matrix, all AHB and all APB peripherals from Table 31 (p48, Range 1, typical uA/MHz, the only figures given)", note = "the datasheet gives no maximum with peripherals enabled, so their typical share is added to the peripherals-disabled maximum" }
