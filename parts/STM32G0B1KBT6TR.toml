mpn = "STM32G0B1KBT6TR"
manufacturer = "STMicroelectronics"
description = "Arm Cortex-M0+ MCU, 128 KB flash, FDCAN and USB, LQFP-32"
class = "ic"
temperature = { min = -40, max = 85, page = 68, note = "TA, suffix 6, Table 24 general operating conditions" }
theta_ja = { value = 59, page = 155, note = "Table 95, LQFP32 7 x 7 mm, junction to ambient" }
tj_max = { value = 105, page = 68, note = "TJ junction temperature, suffix 6; the absolute maximum TJ is 150 C (p67)" }

[datasheet]
title = "STM32G0B1xB/xC/xE Arm Cortex-M0+ 32-bit MCU, up to 512KB Flash, 144KB RAM, 6x USART, timers, ADC, DAC, comm. I/Fs, 1.7-3.6V"
document = "DS13560 Rev 3"
url = "https://www.lcsc.com/datasheet/C7021416.pdf"

# "LQFP32 / UFQFPN32 - GP" column of Table 12 (pages 47 to 55).
[pins]
1 = "PB9"
2 = "PC14-OSC32_IN"
3 = "PC15-OSC32_OUT"
4 = "VDD/VDDA"
5 = "VSS/VSSA"
6 = "PF2-NRST"
7 = "PA0"
8 = "PA1"
9 = "PA2"
10 = "PA3"
11 = "PA4"
12 = "PA5"
13 = "PA6"
14 = "PA7"
15 = "PB0"
16 = "PB1"
17 = "PB2"
18 = "PA8"
19 = "PA9"
20 = "PC6"
21 = "PA10"
22 = "PA11 [PA9]"
23 = "PA12 [PA10]"
24 = "PA13"
25 = "PA14-BOOT0"
26 = "PA15"
27 = "PB3"
28 = "PB4"
29 = "PB5"
30 = "PB6"
31 = "PB7"
32 = "PB8"

[[limit]]
pins = ["VDD/VDDA"]
to = "VSS/VSSA"
abs_max = { min = -0.3, max = 4.0, page = 66 }
recommended = { min = 1.7, max = 3.6, page = 67, note = "1.62 V minimum on VDDA for ADC and COMP, 1.8 V for the DAC (page 68)" }

# FT_xx pins other than FT_c.
[[limit]]
pins = ["PB9", "PC14-OSC32_IN", "PC15-OSC32_OUT", "PA0", "PA1", "PA2", "PA3", "PA6", "PA7", "PB0", "PB1", "PB2", "PA9", "PC6", "PA10", "PA11 [PA9]", "PA12 [PA10]", "PA13", "PA14-BOOT0", "PA15", "PB3", "PB4", "PB5", "PB6", "PB7", "PB8"]
to = "VSS/VSSA"
abs_max = { min = -0.3, max = { pin = "VDD/VDDA", plus = 4.0 }, page = 66, note = "above 4 V the internal pull-up and pull-down must be disabled" }
recommended = { min = -0.3, max = { pin = "VDD/VDDA", plus = 3.6, at_most = 5.5 }, page = 68, note = "pull-up and pull-down must be disabled above VDD + 0.3 V" }

# PA8 is FT_fcs: USB Type-C PD capable.
[[limit]]
pins = ["PA8"]
to = "VSS/VSSA"
abs_max = { min = -0.3, max = 5.5, page = 66, note = "FT_c pin" }
recommended = { min = -0.3, max = 5.0, page = 68, note = "FT_c pin" }

# PA4 and PA5 are TT_a / TT_ea: not 5 V tolerant.
[[limit]]
pins = ["PA4", "PA5"]
to = "VSS/VSSA"
abs_max = { min = -0.3, max = 4.0, page = 66, note = "any pin other than FT_xx" }
recommended = { min = -0.3, max = { pin = "VDD/VDDA", plus = 0.3 }, page = 68, note = "TT_xx" }

[[limit]]
pins = ["PF2-NRST"]
to = "VSS/VSSA"
abs_max = { min = -0.3, max = 4.0, page = 66, note = "Table 12 lists no FT structure for this pin, so the any-other-pin row applies" }
recommended = { min = -0.3, max = { unknown = "Table 24 gives only the generic I/O range, which is above this pin's 4.0 V absolute maximum" }, page = 68 }

[[esd]]
model = "hbm"
volts = 2000
page = 92
note = "Table 52, ANSI/ESDA/JEDEC JS-001, class 2"

[[esd]]
model = "cdm"
volts = 250
page = 92
note = "Table 52, ANSI/ESDA/JEDEC JS-002, class C2a"

[[supply]]
pins = ["VDD/VDDA"]
current = { min = 0, max = 0.02046, page = 72, derived = "0 .. (9.7 + (0.5 + 3.1 + 2.9 + 3.0 + 2.7 + 1.6 + 2.8 + 0.5 + 31 + 120) * 64 / 1000) / 1000; IDD(Run) max 9.7 mA (Table 28, Range 1, 64 MHz from Flash, die at 130 C, VDD = 3.6 V, peripherals disabled) plus every peripheral enabled at 64 MHz: IOPORT, GPIOA to GPIOF, bus matrix, all AHB and all APB peripherals from Table 36 (p78, Range 1, typical uA/MHz, the only figures given)", note = "the datasheet gives no maximum with peripherals enabled, so their typical share is added to the peripherals-disabled maximum" }
