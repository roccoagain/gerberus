# Every UNI-ROYAL (UniOhm) thick-film chip resistor, from its 14-code part number: 0402WGF1001TCE is size 0402,
# power WG (1/16 W), tolerance F (±1 %), value 1001 (100 x 10^1 = 1 kohm), packing T (tape), quantity C (10000),
# then E (lead-free). The JLCPCB basic resistors are almost all from this series. A 01005 is size code 0105, as
# the ordering example on page 2 gives it.
family = "UNI-ROYAL thick film"
manufacturer = "UNI-ROYAL (Uniroyal Electronics)"
description = "thick-film chip resistor"
class = "resistor"
mpn = "{size}{power}{tolerance}{value}{packing}{quantity}E"
rcwv_page = 5

[datasheet]
title = "Thick Film Chip Resistors, 01005/0201/0402/0603/0805/1206/1210/1812/2010/2512 Series"
document = "V.3, February 12, 2019"
url = "https://datasheet.lcsc.com/datasheet/pdf/0a975aaa49b7c97f38a963127be4a823.pdf"

[field.size]
page = 2
codes = ["0105", "0201", "0402", "0603", "0805", "1206", "1210", "1812", "2010", "2512"]

# 2.2: W then the wattage code. Which size takes which code is the power rating column on page 4.
[field.power]
page = 2
codes = ["WH", "WM", "WG", "WA", "W8", "W4", "W3", "W2", "07", "1W"]

[field.tolerance]
page = 2
codes = { D = 0.005, F = 0.01, G = 0.02, J = 0.05 }

# 2.4: three significant figures and a power of ten (J, K, L for 10^-1 to 10^-3); a ±5 % value starts with 0.
[field.value]
page = 2
kind = "resistance-digits"

[field.packing]
page = 2
codes = ["C", "T"]

# 2.5.2 lists 4, 5, C, D and E; the ordering example on the same page adds 1, 2 and 3.
[field.quantity]
page = 2
codes = ["1", "2", "3", "4", "5", "C", "D", "E"]

# Section 6, page 4: power rating at 70 °C, by size (and for 0805 and 1206, by resistance).

[[rating]]
when = { size = ["0105"], power = ["WH"] }
power = 0.03125
page = 4
note = "01005, 1/32 W at 70 °C, derated above"

