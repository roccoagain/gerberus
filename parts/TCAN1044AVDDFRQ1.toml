mpn = "TCAN1044AVDDFRQ1"
manufacturer = "Texas Instruments"
description = "Automotive fault-protected CAN FD transceiver with VIO level shifter, SOT-23-8 (DDF)"
class = "ic"
theta_ja = { value = 122, page = 5, note = "6.5 thermal characteristics, DDF (SOT) package" }
tj_max = { value = 150, page = 5, note = "operating junction temperature, recommended operating conditions; the absolute maximum TJ is 165 C (p4)" }

[datasheet]
title = "TCAN1044A-Q1 Automotive Fault-Protected CAN FD Transceiver with Standby mode"
document = "SLLSFJ3D, revised October 2024 (covers TCAN1044AV-Q1)"
url = "https://www.ti.com/lit/ds/symlink/tcan1044a-q1.pdf"

[pins]
1 = "TXD"
2 = "GND"
3 = "VCC"
4 = "RXD"
5 = "VIO"
6 = "CANL"
7 = "CANH"
8 = "STB"

[[limit]]
pins = ["VCC"]
to = "GND"
abs_max = { min = -0.3, max = 6, page = 4 }
recommended = { min = 4.5, max = 5.5, page = 4 }

[[limit]]
pins = ["VIO"]
to = "GND"
abs_max = { min = -0.3, max = 6, page = 4 }
recommended = { min = 1.7, max = 5.5, page = 4 }

[[limit]]
pins = ["CANH", "CANL"]
to = "GND"
abs_max = { min = -58, max = 58, page = 4 }
recommended = { min = -12, max = 12, page = 7, note = "receiver common-mode range VCM" }

[[limit]]
pins = ["CANH"]
to = "CANL"
abs_max = { min = -45, max = 45, page = 4 }
recommended = { none = "the datasheet gives no recommended differential bus voltage range" }

[[limit]]
pins = ["TXD", "STB"]
to = "GND"
abs_max = { min = -0.3, max = 6, page = 4 }
recommended = { none = "the recommended operating conditions table lists no logic input range; only VIH min 0.7 VIO and VIL max 0.3 VIO (page 7)" }

[[limit]]
pins = ["RXD"]
to = "GND"
abs_max = { min = -0.3, max = 6, page = 4 }
recommended = { none = "RXD is an output; the recommended operating conditions table lists only its output current" }

[[esd]]
model = "hbm"
volts = 4000
page = 4
note = "AEC Q100-002, all pins, classification level 3A"

[[esd]]
pins = ["CANH", "CANL"]
model = "hbm"
volts = 10000
page = 4
note = "AEC Q100-002, global pins CANH and CANL with respect to GND, level 3B"

[[esd]]
model = "cdm"
volts = 750
page = 4
note = "AEC Q100-011, all pins, level C5"

[[esd]]
pins = ["CANH", "CANL"]
model = "iec-contact"
volts = 8000
page = 4
note = "system level, CAN bus terminals to GND: unpowered contact discharge per ISO 10605 (tested to IEC 62228-3), and powered contact discharge per SAE J2962-2"

[[esd]]
pins = ["CANH", "CANL"]
model = "iec-air"
volts = 15000
page = 4
note = "system level, CAN bus terminals to GND: powered air discharge per SAE J2962-2 / ISO 10605"

[[supply]]
pins = ["VCC"]
current = { min = 0, max = 0.08, page = 5, note = "ICC normal mode, dominant, STB = 0 V, TXD = 0 V, RL = 50 ohm: the bus held dominant. 130 mA with a bus fault (CANH = CANL = +-25 V, RL open)" }

[[supply]]
pins = ["VIO"]
current = { min = 0, max = 0.0003, page = 5, note = "IIO normal mode, dominant, RXD floating" }
