mpn = "ME6211C33M5G-N"
manufacturer = "Microne"
description = "3.3 V 500 mA LDO with enable, SOT-23-5"
class = "ic"

[datasheet]
title = "ME6211 Series High Speed LDO Regulators, Low ESR Cap"
document = "V14"
url = "https://www.lcsc.com/datasheet/C82942.pdf"

[pins]
1 = "VIN"
2 = "VSS"
3 = "CE"
4 = "NC"
5 = "VOUT"

[[limit]]
pins = ["VIN"]
to = "VSS"
abs_max = { min = { unknown = "the absolute maximum ratings table gives only a maximum for VIN" }, max = 6.5, page = 5 }
recommended = { min = 2, max = 6.0, page = 1, note = "features list: operating voltage range" }

[[limit]]
pins = ["CE"]
to = "VSS"
abs_max = { min = -0.3, max = { pin = "VIN", plus = 0.3 }, page = 5 }
recommended = { unknown = "no CE operating range is given; only VCEH min 1.0 V and VCEL max 0.5 V (page 8, ME6211C33 table)" }

[[limit]]
pins = ["VOUT"]
to = "VSS"
abs_max = { min = -0.3, max = { pin = "VIN", plus = 0.3 }, page = 5 }
recommended = { unknown = "VOUT is the regulated output; no separate operating range is given" }

[[drive]]
kind = "regulates"
pin = "VOUT"
to = "VSS"
supply = "VIN"
headroom = { volts = 1.0, page = 8, note = "the output range is specified at VIN = VOUT + 1 V; the dropout has no maximum" }
range = { min = 3.234, max = 3.366, page = 8, derived = "VOUT(T) × 0.98 to × 1.02, where VOUT(T) is the ME6211C33 nominal", note = "ME6211C33 output voltage, 0.98 to 1.02 x 3.3 V at IOUT = 30 mA, VIN = VOUT + 1 V, 25 C" }
