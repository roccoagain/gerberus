mpn = "TVS0500DRVR"
manufacturer = "Texas Instruments"
description = "5 V flat-clamp surge protection diode, 155 pF, WSON-6 2x2"
class = "tvs"

[datasheet]
title = "TVS0500 5-V Flat-Clamp Surge Protection Device"
document = "SLVSED2C, revised November 2019"
url = "https://www.ti.com/lit/ds/symlink/tvs0500.pdf"

[pins]
1 = "GND"
2 = "GND"
3 = "GND"
4 = "IN"
5 = "IN"
6 = "IN"
7 = "GND"

[[limit]]
pins = ["IN"]
to = "GND"
abs_max = { none = "the maximum ratings table gives only surge ratings and a 50 mA DC breakdown current; there is no DC voltage maximum" }
recommended = { min = { none = "the datasheet gives no negative operating limit" }, max = 5, page = 5, note = "reverse stand-off voltage VRWM, printed in the NOM column with no MAX; taken as the highest working voltage" }
breakdown = { min = 7.5, max = 8.4, page = 6, note = "VBR at IIN = 1 mA from IO to GND" }

[[capacitance]]
pins = ["IN"]
to = "GND"
typ = 155
page = 6
note = "input pin capacitance CIN at VIN = 5 V, f = 1 MHz; no maximum is given. The same table limits the input slew rate to 2.5 V/µs, so the part is meant for power rails, not data lines"
