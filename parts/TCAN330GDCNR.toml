mpn = "TCAN330GDCNR"
manufacturer = "Texas Instruments"
description = "3.3 V CAN FD transceiver with shutdown and silent mode, SOT-23-8 (DCN)"
class = "ic"
temperature = { min = -40, max = 125, page = 5, note = "TA operational free-air temperature" }
theta_ja = { value = 154.4, page = 6, note = "5.4 thermal information, DCN (SOT-23) package" }
tj_max = { value = 150, page = 5, note = "operating junction temperature range TJ, listed in the 5.1 absolute maximum ratings table" }

[datasheet]
title = "TCAN33x 3.3V CAN Transceivers with CAN FD (Flexible Data Rate)"
document = "SLLSEQ7F, revised May 2025"
url = "https://www.ti.com/lit/ds/symlink/tcan330.pdf"

[pins]
1 = "TXD"
2 = "GND"
3 = "VCC"
4 = "RXD"
5 = "SHDN"
6 = "CANL"
7 = "CANH"
8 = "S"

[[limit]]
pins = ["VCC"]
to = "GND"
abs_max = { min = -0.3, max = 5, page = 5 }
recommended = { min = 3, max = 3.6, page = 5 }

[[limit]]
pins = ["CANH", "CANL"]
to = "GND"
abs_max = { min = -14, max = 14, page = 5 }
recommended = { min = -12, max = 12, page = 8, note = "receiver common-mode range VCM, normal and silent modes" }

[[limit]]
pins = ["TXD", "SHDN", "S"]
to = "GND"
abs_max = { min = -0.3, max = 5, page = 5 }
recommended = { unknown = "the recommended operating conditions table lists no logic input range; only VIH min 2 V and VIL max 0.8 V (page 8)" }

[[limit]]
pins = ["RXD"]
to = "GND"
abs_max = { min = -0.3, max = 5, page = 5 }
recommended = { unknown = "RXD is an output; the recommended operating conditions table lists only its output current" }

[[esd]]
pins = ["TXD", "GND", "VCC", "RXD", "SHDN", "S"]
model = "hbm"
volts = 4000
page = 5
note = "ANSI/ESDA/JEDEC JS-001, all pins except CANH and CANL"

[[esd]]
pins = ["CANH", "CANL"]
model = "hbm"
volts = 25000
page = 5

[[esd]]
model = "cdm"
volts = 1500
page = 5
note = "JESD22-C101, all pins"

[[esd]]
pins = ["CANH", "CANL"]
model = "iec-contact"
volts = 12000
page = 5
note = "CANH and CANL terminals to GND; the table misprints the standard as IEC 61400-4-2 (p21 says IEC61000-4-2)"

[[supply]]
pins = ["VCC"]
current = { min = 0, max = 0.06, page = 6, note = "ICC normal mode, dominant, TXD = 0 V, RL = 50 ohm, high bus load: the bus held dominant. 180 mA with a bus fault (CANH = -12 V, RL open)" }
