mpn = "KT-0805G"
manufacturer = "Hubei KENTO Electronic"
description = "Green LED, 0805"
class = "led"

[datasheet]
title = "0805 green (翠绿) chip LED specification"
document = "Revision A.0"
url = "https://www.lcsc.com/datasheet/C2297.pdf"

[pins]
1 = "K"
2 = "A"

[[limit]]
pins = ["K"]
to = "A"
abs_max = { min = { unknown = "forward voltage is set by the forward current, not rated" }, max = 5, page = 3, note = "reverse voltage VR" }
recommended = { min = { unknown = "forward voltage is set by the forward current, not rated" }, max = 5, page = 10, note = "caution 11.6.4: the reverse voltage across the LED shall not be higher than 5 V when lit or tested" }

[[limit]]
quantity = "current"
pins = ["A"]
to = "K"
abs_max = { min = { unknown = "the datasheet does not rate reverse current" }, max = 0.030, page = 3, note = "DC forward current IF; 60 mA peak at 1/10 duty, 0.1 ms" }
recommended = { unknown = "the datasheet has only an absolute maximum ratings table" }

[[drive]]
kind = "forward"
pin = "A"
to = "K"
current = 0.005
range = { min = 2.6, max = 3.1, page = 3, note = "VF at IF = 5 mA" }
