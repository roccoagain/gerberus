mpn = "PJ-102AH"
manufacturer = "Same Sky (Formerly CUI Devices)"
description = "DC power jack, 2.0 mm center pin, right angle, through hole, with switch contact"
class = "connector"

temperature = { min = -25, max = 85, page = 1, note = "Specifications: operating temperature" }

[datasheet]
title = "MODEL: PJ-102AH | DESCRIPTION: DC POWER JACK"
document = "PJ-102AH datasheet rev 1.05, dated 09/12/2024"
url = "https://www.sameskydevices.com/product/resource/pj-102ah.pdf"

# The schematic and recommended PCB layout on p2 number the terminals 1, 2, 3 and print no other pin names:
# 1 is the center pin, 2 the sleeve spring contact, 3 the switch contact that touches 2 with no plug in.
# The board's footprint (BarrelJack_CUI_PJ-102AH_Horizontal) has pads 1, 2, 3; the symbol (Connector:Jack-DC)
# has only 1 and 2, and the schematic's Footprint_Review says pad 3 is left unconnected on purpose.
[pins]
1 = "1"
2 = "2"
3 = "3"

# No 'to': the rating applies between any two contacts.
# The rated input voltage is printed in the table's typ column. It is the jack's rating, not a typical
# measurement, so it is read as the rating (as for any connector's rated voltage).
[[limit]]
pins = ["1", "2", "3"]
abs_max = { unknown = "the sheet gives a rated voltage and a 500 Vac one-minute withstand test, not an absolute maximum" }
recommended = { min = -24, max = 24, page = 1, note = "Specifications: rated input voltage 24 Vdc (printed in the typ column)" }

[[limit]]
quantity = "current"
pins = ["1", "2"]
abs_max = { unknown = "the sheet gives only a rated current" }
recommended = { min = -5.0, max = 5.0, page = 1, note = "Specifications: rated input current 5.0 A max" }

[[limit]]
quantity = "current"
pins = ["3"]
abs_max = { unknown = "the sheet gives only a rated current" }
recommended = { unknown = "the rated input current (5.0 A) is the jack's rating; the sheet doesn't say it covers the switch contact" }
