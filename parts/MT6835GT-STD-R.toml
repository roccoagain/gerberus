mpn = "MT6835GT-STD-R"
manufacturer = "MagnTek"
description = "21-bit magnetic angle encoder, SPI / ABZ / UVW / PWM, TSSOP-16"
class = "ic"

[datasheet]
title = "MT6835 21-bit high-resolution, high-accuracy magnetic angle encoder IC (Chinese)"
document = "Version 1.3, December 2022"
url = "https://www.lcsc.com/datasheet/C2932578.pdf"

# Section 1 pin list, page 3.
[pins]
1 = "U"
2 = "V"
3 = "W"
4 = "CAL_EN"
5 = "MISO"
6 = "MOSI"
7 = "SCK"
8 = "CSN"
9 = "VDD"
10 = "OUT"
11 = "TEST"
12 = "VSS"
13 = "TEST_EN"
14 = "Z"
15 = "B"
16 = "A"

[[limit]]
pins = ["VDD"]
to = "VSS"
abs_max = { min = -0.5, max = 6.5, page = 5, note = "section 3, supply voltage" }
recommended = { min = 3.0, max = 5.5, page = 5, note = "section 4, supply voltage" }

[[limit]]
pins = ["U", "V", "W", "CAL_EN", "MISO", "MOSI", "SCK", "CSN", "OUT", "TEST", "TEST_EN", "Z", "B", "A"]
to = "VSS"
abs_max = { min = -0.5, max = { pin = "VDD" }, page = 5, note = "section 3, pin input voltage range" }
recommended = { unknown = "section 4 (normal operating conditions) lists no pin voltage range" }

[[esd]]
model = "hbm"
volts = 8000
page = 5
note = "静电防护能力（人体放电模式）, AEC-Q100-002"

[[esd]]
model = "cdm"
volts = 1500
page = 5
note = "静电防护能力（元件充电模式）, AEC-Q100-011"
