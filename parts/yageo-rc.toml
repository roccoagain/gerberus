# Every Yageo RC_L thick-film chip resistor, from its part number: RC0805FR-0710KL is size 0805, tolerance F
# (±1 %), packing R (paper tape), reel 07 (7 inch, standard power), 10K (10 kohm), L (the default code).
family = "Yageo RC_L"
manufacturer = "Yageo"
description = "thick-film chip resistor"
class = "resistor"
mpn = "RC{size}{tolerance}{packing}-{reel}{value}L"

[datasheet]
title = "General purpose chip resistors, RC_L series, sizes 0075 to 2512"
document = "Product specification, August 02, 2022 V.12"
url = "https://datasheet.lcsc.com/datasheet/pdf/b426be3ce22c6de3e0c3a2248e49159e.pdf"

[field.size]
page = 2
codes = ["0075", "0100", "0201", "0402", "0603", "0805", "1206", "1210", "1218", "2010", "2512"]

[field.tolerance]
page = 2
codes = { B = 0.001, D = 0.005, F = 0.01, J = 0.05 }

[field.packing]
page = 2
codes = ["R", "K", "S"]

# 07, 10, 13: reel size, standard power. 7W and 3W: twice the standard power. 7D: twice the quantity. 7N: ESD-safe.
[field.reel]
page = 2
codes = ["07", "10", "13", "7W", "7D", "7N", "3W"]

[field.value]
page = 2
kind = "resistance"

# Table 2 and Table 3: power at 70 °C, operating temperature range and maximum working voltage, per size. Sizes
# with a second row give twice the power with reel code 7W or 3W.

[[rating]]
when = { size = ["0075"], reel = ["07", "10", "13", "7D", "7N"] }
power = 0.02
max_working_voltage = 10
temperature = { min = -55, max = 125 }
page = 4
note = "RC0075, 1/50 W at 70 °C, derated above"

