mpn = "SM04B-SRSS-TB(LF)(SN)"
manufacturer = "JST"
description = "JST SH 4-pin header, 1.0 mm pitch, side entry"
class = "connector"

[datasheet]
title = "SH Connector, 1.0 mm pitch disconnectable crimp style"
document = "JST catalogue page, no revision printed"
url = "https://www.lcsc.com/datasheet/C160404.pdf"

[pins]
1 = "1"
2 = "2"
3 = "3"
4 = "4"

# No 'to': the rating applies between any two of the listed contacts.
[[limit]]
pins = ["1", "2", "3", "4"]
abs_max = { unknown = "the catalogue gives a rated voltage and a 500 V AC one-minute withstanding test, not an absolute maximum" }
recommended = { min = -50, max = 50, page = 1, note = "voltage rating 50 V AC, DC" }

[[limit]]
quantity = "current"
pins = ["1", "2", "3", "4"]
abs_max = { unknown = "the catalogue gives only a current rating" }
recommended = { min = -1.0, max = 1.0, page = 1, note = "current rating 1.0 A AC, DC with AWG #28 wire" }
