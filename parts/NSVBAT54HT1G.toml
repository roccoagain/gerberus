mpn = "NSVBAT54HT1G"
manufacturer = "onsemi"
description = "30 V 200 mA Schottky barrier diode, SOD-323, AEC-Q101 (NSV prefix)"
class = "diode"
theta_ja = { value = 635, page = 1, note = "RθJA junction to ambient, thermal characteristics table (FR-4 minimum pad, note 1); PD 200 mW at TA = 25 °C, derate 1.6 mW/°C above 25 °C" }
tj_max = { value = 150, page = 1, note = "TJ, Tstg junction and storage temperature range −55 to 150 °C, thermal characteristics table" }

# The datasheet is the BAT54H sheet; its ordering information (p1) lists NSVBAT54HT1G beside BAT54HT1G, SOD-323,
# and its features list says the NSV prefix is the automotive (AEC-Q101, PPAP) version.
# p1 prints the TJ range as "−55 to150" (no space), so `datasheet verify` reports tj_max NOT FOUND; the rendered
# page shows 150 °C.
# The maximum ratings table's header says "TJ = 125°C unless otherwise noted" and holds only VR; IF, IFSM, IFRM
# and the temperature range sit in the thermal characteristics table under its "Max" column.

[datasheet]
title = "BAT54H Schottky Barrier Diodes, 30 Volt Silicon Hot-Carrier Detector and Switching Diodes"
document = "BAT54HT1/D, Rev. 9, November 2024"
url = "https://www.onsemi.com/pdf/datasheet/bat54ht1-d.pdf"

# Pin table: SOD-323 style 1, pin 1 cathode (polarity band), pin 2 anode (p1, p4).
[pins]
1 = "K"
2 = "A"

[[limit]]
pins = ["K"]
to = "A"
abs_max = { min = { unknown = "forward bias is limited by current, not voltage" }, max = 30, page = 1, note = "VR reverse voltage, maximum ratings" }
recommended = { min = { unknown = "forward bias is limited by current, not voltage" }, max = 30, page = 1, note = "VR from the maximum ratings table, the only reverse-voltage rating the datasheet gives (no recommended operating conditions); V(BR)R min 30 V at IR = 10 uA, p2" }

[[limit]]
quantity = "current"
pins = ["A"]
to = "K"
abs_max = { min = { unknown = "reverse current is set by the reverse voltage and is not rated" }, max = 0.2, page = 1, note = "IF forward current (DC), Max column; IFRM 300 mA (1 s pulse, 66 % duty), IFSM 600 mA (tp < 10 ms)" }
recommended = { min = { unknown = "reverse current is set by the reverse voltage and is not rated" }, max = 0.2, page = 1, note = "IF forward current (DC), the only continuous current rating given; IFRM and IFSM are for pulses only" }

[[drive]]
kind = "forward"
pin = "A"
to = "K"
range = { min = { unknown = "only maximum forward voltages are given" }, max = 0.8, page = 2, note = "VF max at IF = 100 mA, TA = 25 °C, the highest current with a VF figure; 0.24 V at 0.1 mA, 0.32 V at 1 mA, 0.40 V at 10 mA, 0.50 V at 30 mA" }

[[capacitance]]
pins = ["K"]
to = "A"
typ = 7.6
max = 10
page = 2
note = "CT total capacitance, VR = 1.0 V, f = 1.0 MHz, TA = 25 °C"
