mpn = "TPS560430YFDBVR"
manufacturer = "Texas Instruments"
description = "4 V to 36 V, 600 mA synchronous buck, 2.1 MHz forced PWM, adjustable, SOT-23-6"
class = "ic"
theta_ja = { value = 173, page = 4, note = "7.4 thermal information, DBV (6 pins); TI notes it is for comparing packages, not for design" }
tj_max = { value = 125, page = 4, note = "operating junction temperature range, recommended operating conditions; the absolute maximum TJ is 150 C" }

[datasheet]
title = "TPS560430 SIMPLE SWITCHER 4-V to 36-V, 600-mA Synchronous Step-Down Converter"
document = "SLVSE22B, revised June 2018"
url = "https://www.ti.com/lit/ds/symlink/tps560430.pdf"

[pins]
1 = "CB"
2 = "GND"
3 = "FB"
4 = "EN"
5 = "VIN"
6 = "SW"

[[limit]]
pins = ["VIN"]
to = "GND"
abs_max = { min = -0.3, max = 38, page = 4 }
recommended = { min = 4, max = 36, page = 4 }

[[limit]]
pins = ["EN"]
to = "GND"
abs_max = { min = -0.3, max = { pin = "VIN", plus = 0.3 }, page = 4 }
recommended = { min = 0, max = { pin = "VIN" }, page = 4 }

[[limit]]
pins = ["FB"]
to = "GND"
abs_max = { min = -0.3, max = 5.5, page = 4 }
recommended = { min = 0, max = 4.5, page = 4 }

[[limit]]
pins = ["SW"]
to = "GND"
abs_max = { min = -0.3, max = { pin = "VIN", plus = 0.3 }, page = 4, note = "–3.5 V to 38 V for transients under 10 ns" }
recommended = { unknown = "the recommended operating conditions table lists no SW range; SW is the switch node" }

[[limit]]
pins = ["CB"]
to = "SW"
abs_max = { min = -0.3, max = 5.5, page = 4 }
recommended = { unknown = "the recommended operating conditions table lists no CB-to-SW range" }

[[drive]]
kind = "regulates"
pin = "FB"
to = "GND"
supply = "VIN"
feedback = true
headroom = { duty = 0.98, page = 1, note = "98 % maximum duty cycle; switch and inductor drops are not modelled" }
range = { min = 0.985, max = 1.015, page = 5, note = "reference voltage VREF, TJ -40 to 125 C" }

[[drive]]
kind = "switches"
pin = "SW"
to = "GND"
supply = "VIN"
range = { min = { unknown = "the undershoot below GND during dead time is not given" }, max = { unknown = "SW rises above VIN by a body-diode drop during dead time, which is not given" }, page = 3, note = "pin functions: SW connects to the high-side FET source and the low-side FET drain" }

[[esd]]
model = "hbm"
volts = 2500
page = 4

[[esd]]
model = "cdm"
volts = 750
page = 4
