# Derating policy: project judgement, kept apart from the datasheet facts in parts/.
# A checker warns when a net stays inside a part's recommended range but above `factor` of it.
# A rule with `mpn` wins over a class rule for the same quantity.

[[derate]]
class = "capacitor"
quantity = "voltage"
factor = 0.8
reason = "keep MLCCs at or below 80 % of rated voltage; X5R/X7R lose capacitance under DC bias and margin covers ripple"

# Reliability derating: a part run near its rating is inside it but ages faster. These shares are project
# judgement in line with common derating guides, not datasheet figures.
[[derate]]
class = "resistor"
quantity = "power"
factor = 0.5
reason = "reliability derating: keep resistors at or below half their rated power"

[[derate]]
class = "diode"
quantity = "current"
factor = 0.5
reason = "reliability derating: keep diodes at or below half their rated forward current"

[[derate]]
class = "led"
quantity = "current"
factor = 0.5
reason = "reliability derating: keep LEDs at or below half their rated forward current; light output also fades faster when driven hard"

# A pin on an external connector meets ESD when a TVS or ESD diode clamps its net, or when every part on the net is
# rated to this IEC 61000-4-2 level. Component ratings (HBM, CDM) only cover handling in a factory.
[esd]
contact = 8000
air = 15000
reason = "IEC 61000-4-2 level 4 (8 kV contact, 15 kV air), the usual target for a connector a person plugs cables into"

# Keep every junction this far below its maximum temperature. A part run near its limit is inside its rating but
# ages faster; the margin is project judgement, not a datasheet figure.
[junction]
margin = 20
reason = "reliability derating: keep junctions 20 °C below their maximum"

# `gerberus stress`: each supply input is switched on through a cable into the board, in ngspice. The cable's
# inductance rings with the input capacitors; each run draws it from this range, and every part value from its
# tolerance. Project judgement, not datasheet figures.
[spice]
cable_inductance = [0.1e-6, 1.0e-6]
cable_resistance = 0.1
rise_time = 1e-6
duration = 2e-3
runs = 16
reason = "hot plug through up to 1 µH of cable (about a metre), 0.1 Ω, switched on in 1 µs"

# `gerberus traces`: how much a track may warm above the board at its net's worst-case current, for IPC-2221's
# safe-current fit. Project judgement, not datasheet figures.
[traces]
rise = 10
reason = "a 10 °C rise, the usual design figure"

# `gerberus traces`: how far a power pin's pad may be from the nearest decoupling capacitor to ground on its net,
# pad centre to pad centre, and the largest capacitor that counts as decoupling (a bigger one is bulk storage for
# slow load changes, which needn't be close). Project judgement, not datasheet figures: the further, the more
# track inductance between them.
[decoupling]
distance = 5
largest = 1e-6
reason = "within 5 mm, the usual layout guideline for a decoupling capacitor of 1 µF or less"

# `gerberus traces`: the largest area a switching regulator's input loop (supply pin, input capacitor, ground pin)
# may enclose, through the pad centres. Project judgement, not datasheet figures: an input capacitor right beside
# a small switcher's pins encloses a few mm².
[hot_loop]
area = 25
reason = "25 mm², an input capacitor placed beside the switcher's supply and ground pins"

# `gerberus traces`: the fastest edge a digital output pin is taken to make, as part files don't give output rise
# times. Project judgement: fast enough to cover a modern microcontroller's fastest GPIO speed setting.
[edges]
rise = 1e-9
reason = "1 ns, a microcontroller GPIO at its fastest speed setting"
