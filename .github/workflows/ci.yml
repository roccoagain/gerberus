name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New RustSec advisories land without any change here, so check weekly as well.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo doc --no-deps --locked

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y ngspice
      # tests/tscircuit.rs turns a .tsx board into Circuit JSON with the tscircuit CLI, pinned in ci/tscircuit.
      - name: Install the tscircuit CLI
        run: |
          npm ci --prefix ci/tscircuit
          echo "$GITHUB_WORKSPACE/ci/tscircuit/node_modules/.bin" >> "$GITHUB_PATH"
      - run: cargo fetch --locked
      - name: Test with the network blocked by a dead proxy
        run: cargo test --all-targets --locked --offline
        # Tests must not touch the network: BOM checks read the LCSC snapshot in tests/fixtures/lcsc. Pointing
        # every proxy at a closed port makes a lookup that slips through fail instead of passing by luck.
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""

  # Gerberus runs on macOS and Windows too, so the tests run there as well (path handling, line endings).
  test-other-os:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test should fail the job, not hold a runner for hours.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: runner.os == 'macOS'
        run: brew install ngspice
      - if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-ngspice
      - if: runner.os == 'Windows'
        name: Put ngspice on PATH
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ls "$MSYS2_ROOT"/ucrt64/bin/ngspice*
          cygpath -w "$MSYS2_ROOT/ucrt64/bin" >> "$GITHUB_PATH"
      - name: Install the tscircuit CLI
        run: |
          npm ci --prefix ci/tscircuit
          echo "$GITHUB_WORKSPACE/ci/tscircuit/node_modules/.bin" >> "$GITHUB_PATH"
      - run: cargo fetch --locked
      - name: Test with the network blocked by a dead proxy
        run: cargo test --all-targets --locked --offline --no-fail-fast
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install the oldest supported Rust
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          rustup toolchain install "$msrv" --profile minimal
          # Overrides rust-toolchain.toml for every later step, rust-cache included, so the pinned toolchain is
          # never installed here and the cache key follows the MSRV.
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --all-targets --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Install the tscircuit CLI
        run: |
          npm ci --prefix ci/tscircuit
          echo "$GITHUB_WORKSPACE/ci/tscircuit/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fetch --locked
      - name: Measure line coverage with the network blocked by a dead proxy
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          cargo llvm-cov --all-targets --locked --offline --lcov --output-path lcov.info --fail-under-lines 80
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov
          path: lcov.info

  # Dependencies listed in Cargo.toml that the code no longer uses.
  unused-deps:
    name: unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-machete@0.9.1
      - run: cargo machete

  # Mistakes and security problems in the workflows themselves (injection, over-broad tokens, unpinned actions).
  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: zizmor@1.32.0
      # install-action doesn't carry actionlint; its own image includes shellcheck for the `run:` scripts.
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color .github/workflows/ci.yml
      - run: zizmor --offline .github/workflows/ci.yml .github/dependabot.yml

  # The one check to require on main: it passes only when every job above passed, so a new job is covered
  # without touching the ruleset. Add each new job to `needs`.
  ci-ok:
    name: CI OK
    if: always()
    needs: [fmt, clippy, test, test-other-os, msrv, deny, coverage, unused-deps, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a required job ended as '$r'" >&2; exit 1; }
          done
